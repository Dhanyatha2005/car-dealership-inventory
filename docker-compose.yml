# Local PostgreSQL for development and tests.
# Host port 5433 avoids clashing with a locally installed Postgres on 5432.
# Databases: kata_dev (POSTGRES_DB), plus kata_test and kata_e2e created by the init script.
# The init script runs only when the volume is empty; `docker compose down -v` resets it.
name: kata

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kata
      POSTGRES_PASSWORD: kata
      POSTGRES_DB: kata_dev
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kata -d kata_dev']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
